environment: development
sentry:
  # 🔴 **例外の集約**（makoto2#28）。⚠⚠ **DSN は config/local.yaml に置く**（置き場の正本は chubo2 の
  # docs/infra-services.md）。⚠ **空なら初期化しない**（開発機・CI・テストは送らない）。
  dsn: null
  # ⚠ **トレースは送らない**（spans の枠は errors と別だが、要らないものを送らない）。
  traces_sample_rate: 0
http:
  retry:
    limit: 3
    seconds: 1
    # 429 の待ち（`Retry-After` / `X-RateLimit-Reset`）を受け入れる上限（秒）。これより長ければ待たずに諦める。
    # 🔴 ginseng-core の既定は 60 秒だが、それだと最悪 30 × 3 ＋ 60 × 2 ＝ 210 秒で、ライブの枠間隔（3 分）を
    # 超える（v0.7.2 のリリース前レビュー・makoto2#438 で 429 の待ちが効きはじめた）。⚠ 30 なら 150 秒。
    max_seconds: 30
  timeout:
    seconds: 30
logger:
  # 出すログの水準（makoto2#80 の黄 9）。`debug` / `info` / `warn` / `error` / `fatal`。
  #
  # ⚠⚠ **`debug` に落としてあるのは「枠は回ったが本文が無かった」**（→ PostingJob）。
  # ⚠ **ライブの 4 枠は毎日空回りする設計**なので平常日に 171 行出ており、
  # ⚠⚠ **11/4 に壊れて何も出なかった日のログが、平常日と 1 文字も変わらなかった。**
  #
  # ⚠ **debug にすると戻る。**枠ごとの空回りを追いたいときはここを下げる。
  level: info
  mask_fields:
    - password
    - secret
    - token
    - access_token
    - api_key
    - authorization
    - code
    # ⚠ **Sentry の DSN**（makoto2#28）。⚠ **送信専用の鍵だが、`hadlar config` とログには出さない。**
    - dsn
mastodon:
  # 🔴 **投稿先の本文の上限**（URL は 23 字と数える・makoto2#282）。⚠ **原稿の取り込みがここから
  # 前後に付く定型文を引いた残りを上限にする**（→ `PostBudget`）。⚠⚠ **サーバーの設定を
  # 変えたらここも変える**。⚠ **キュアスタ！は 3000**（Mastodon の既定の 500 ではない・オーナー）。
  max_length: 3000
  # 🔴 **モロヘイヤが転送時に足すタグのぶん**（makoto2#282・Codex の P2）。⚠⚠ **モロヘイヤは長さを見ずに
  # 「空行 ＋ タグの行」を末尾に足す**（`default_tag` / 辞書に当たった名前）ので、**本文次第で
  # 長さが変わる。**⚠ **`mulukhiya: true` のときだけ、全部の type から引く。**
  # ✅ **実測から引いた値**（2026-09-24・makoto2#351 の 2.・**st2 へ 81 本出して応答から測った**）:
  #
  # | 出どころ | n | min | median | max |
  # | --- | --- | --- | --- | --- |
  # | ライブ当日（11/4 の 160 枠から） | 18 | 24 | 37 | 65 |
  # | 原稿そのまま ＋ 短文 | 8 | 14 | — | 51 |
  # | 🔴 **曲紹介**（毎日 2 本） | 55 | 22 | 44 | 🔴 **159** |
  # | 人工的にタグを密集させた本文 | 1 | — | — | 233 |
  #
  # 🔴 **いちばん重いのはライブ当日ではなく毎日の曲紹介**（⚠⚠ **曲名・アルバム名・名義に
  # プリキュアの語が大量に入る**）。⚠ **ライブ当日の本文は max 114 字と短い。**
  # 🔴 **300 は実測の max 159 の 1.9 倍**で、**人工的なタグ密集（233）も越える。**
  # ⚠ **前置きの予算は 2400 字になる**（`3000 − 300 − TRACK_RESERVE 300`）が、
  # **実際の前置きは 120 字前後**なので実害は無い。
  # ⚠⚠ **辞書は稼働中のモロヘイヤ側にある**（`RemoteDictionary`）ので、🔴 **こちらが
  # 見ていないところで増えうる** — ⚠ **`rehearsal report` が毎回 max を出す**（makoto2#351）。
  proxy_reserve: 300
  # 🔴 **モロヘイヤ（投稿プロキシ）を経由するか**（makoto2#124）。⚠⚠ **`url` / `acct` /
  # `token` は秘密情報なので config/local.yaml に置く。**ここは経路だけ。
  #
  # ⚠⚠ **`true` が「経由する」＝ `X-Mulukhiya` を送らない。**⚠ **ヘッダを付けたほうが
  # 「経由しない」** — モロヘイヤ側の nginx が `map $http_x_mulukhiya` で**付いている
  # 要求を Mastodon 本体へ直に流す**（自己ループ防止）ため。
  # ⚠⚠ **ginseng-fediverse の既定は「付ける」なので、素で継承すると黙って迂回する**
  # — **2026-08-19 の当日通しリハーサル 162 投稿が 1 本も通っていなかった。**
  #
  # ⚠ **経由するとタグ付け・URL 正規化・画像添付が掛かる。**⚠⚠ **MAKOTO が自分で
  # 付けるのは /live/hashtag の 1 つだけで、あとはモロヘイヤに任せる**（→ 上記
  # `live.hashtag` / HashtagSource）。
  #
  # ⚠⚠ **切り戻しは config/local.yaml に `mulukhiya: false` の 1 行。**当日に
  # モロヘイヤ側が不調なら、これで Mastodon API 直へ戻せる。
  # ⚠ **`optional_config` で既定値に逃がしていない**ので、**消すと起動時ではなく
  # `rake config:lint` で落ちる**（schema の required）。
  #
  # ⚠ **冪等キーはこの経路でも上流へ転送される**（モロヘイヤ v5.34.0〜・mulukhiya-toot-proxy#4598。
  # 🔴 2026-09-19 に記述を実測へ直した = makoto2#278）。⚠⚠ **中継枠はこのヘッダ 1 件だけ**で、
  # モロヘイヤは自分では生成しない。
  # ⚠⚠ **それでも畳んでもらうことは当てにしない。**プロセス内の重なりは
  # PostingJob#claim が塞ぎ（makoto2#109）、残るのは 1 回の post_status の中の HTTP 再送だけ。
  # ⚠ **上流の畳み込みは TTL 1 時間・アカウント単位**なので、それを超える再実行では
  # 効かない。
  mulukhiya: true
monitor:
  # 監視（Uptime Kuma）が叩く HTTP の口（makoto2#84 → MonitorApp / MonitorServer）。
  #
  # ⚠⚠ **既定は 127.0.0.1。**⚠ **開けるのは箱ごとに config/local.yaml へ
  # `bind: 0.0.0.0` を書く明示的な一手にする**ので、「開いていない」が既定のまま残る。
  # ⚠⚠ **LAN 限定・読み取り専用の死活の口だけ**で、管理コンソールは作らない
  # （→ docs/CLAUDE.md「管理操作は CLI で行う」）。
  #
  # ⚠ **切るとポートが開かないので Kuma からは「落ちている」と見える。**ここで
  # 監視そのものを止めるつもりなら、Kuma 側のモニタも一緒に止めること。
  enabled: true
  bind: 127.0.0.1
  # ⚠ tomato-shrieker と同じ番号。**別の箱なので衝突しない**（本番は非同居）。
  # Kuma への登録を他の ginseng 系ボットと同じ形にしておく。
  port: 4567
package:
  authors:
    - Tatsuya Koishi
  description: デルムリン丼のチャットボット「ハドラーブロス」。
  email:
    - tkoishi@b-shock.co.jp
  license: MIT
  url: https://github.com/pooza/hadlar
  version: 0.1.1
scheduler:
  heartbeat:
    interval: 1h
  # 枠の頭を拾う幅（makoto2#90）。⚠ **tick はぴったりの時刻には来ない**ので、この幅だけ
  # 遅れて呼ばれても枠を拾う。
  #
  # ⚠⚠ **tick と同じ値にしない。**同値だと拾えるのは tick が `[枠の頭, 枠の頭+tick)`
  # に落ちたときだけで、⚠ **余裕が構造的にゼロ**になる。⚠⚠ **ライブの枠間隔 180 秒は
  # tick の 10 秒の整数倍なので、位相ずれは 160 枠すべてに同じように効く**
  # （1 枠だけの事故にならない）。
  #
  # ⚠ **枠の間隔より短いこと**（`PostingJob#validate` が起動時に落とす）。いちばん短い
  # 枠は予告・告知の 1m なので、ここは 60 秒未満に収めること。
  #
  # ⚠ **広げても二重投稿にはならない** — 同じ枠なら冪等キーが同じで Mastodon 側が畳む。
  tolerance: 30s
  # 枠の頭を拾いに行く間隔。⚠ **枠ごとにジョブを登録せず、この間隔で叩いて
  # 「いま枠の頭か」を時刻から計算する**（→ Scheduler / PostingJob）。
  # ⚠⚠ **枠の間隔はこれより長いこと。**短いと 1 回の叩きが複数の枠に跨がり、
  # 取りこぼす（PostingJob が起動時に弾く）。ライブは 2 分間隔なので十分余裕がある。
  tick: 10s
  # tick が回らなくなったとみなすまでの猶予（makoto2#80 の黄 7）。
  #
  # ⚠⚠ **ハートビートは tick とは別の rufus ジョブ**なので、⚠ **tick 側だけが詰まっても
  # ハートビートの痕跡は更新され続ける**（＝「生きているが投稿していない」が
  # 検知できない）。そこで **tick が回った時刻を別に記録して、こちらで見る。**
  #
  # ⚠ **tick の間隔（10s）を基準にしない。**⚠⚠ **1 回の tick は投稿の再送で 90 秒以上
  # かかりうる**ので、間隔の数倍では誤報する。⚠ **rufus の `every` は重なって走る**
  # （詰まった 1 回が後続を止めない）ので、**間隔ではなく「何分止まったら異常か」で
  # 決める。**
  #
  # ⚠ **5 分なのはライブの枠間隔（3 分）を基準にしたから。**⚠⚠ **1 枠飛ばした時点で
  # 気付ける**が、⚠ 1 回の tick が伸びただけでは鳴らない。
  tick_stale: 5m
  posting:
    # 何本続けて落ちたら `hadlar status` が警告（2）を返すか（makoto2#78）。
    #
    # ⚠⚠ **数えるのは「本文があるのに出せなかった枠」だけ。**原稿が無い日の枠は
    # 数に入らないので、⚠ **8/15〜10/31 のように 1 本も投稿しない期間があっても
    # 誤検知しない**（→ Heartbeat）。
    #
    # ⚠ **3 なのはライブ当日を基準にしたから。**枠は 3 分間隔なので、⚠⚠ **160 枠が
    # 全滅する形なら 10 分弱で気付ける。**平常日（数本／日）でも同じ日のうちに出る。
    # ⚠ **1 にすると Mastodon 側の一時的な失敗で毎回鳴る**（再送は HTTP 層が済ませた
    # 後なので、ここまで来る失敗自体は珍しくない）。
    failure_limit: 3
    # 落ちた記録がいつまで警告を出し続けるか（makoto2#86・Codex の P2）。
    #
    # 🔴 **makoto2#86 で結末を枠ごとに分けたら、新しい後退ができた。**⚠⚠ **分ける前は
    # 「どれか 1 つでも成功すれば 0 に戻る」ので、古い失敗が自然に掃除されていた。**
    # ⚠ **分けた後は、その枠自身が次に成功するまで消えない。**
    #
    # 🔴 **年に 1 日しか動かない枠がある**（`live-eve` は 11/3、`live-open` /
    # `live-close` は 11/4）。⚠⚠ **その日の最後の 3 枠が落ちると、閾値に達したまま
    # 翌年まで居座り、`/healthz/posting` が 1 年ずっと 503 になる。**
    # ⚠ **枠の名前を変えた・消したときも同じ。**
    #
    # ⚠⚠ **赤が常態化すると誰も見なくなる**（`audit.yml` を `test.yml` に載せなかった
    # のと同じ判断 → docs/CLAUDE.md）。🔴 **本物の警告が埋もれるほうが害が大きい。**
    #
    # ⚠ **7 日なのは「予告の 3 日 ＋ ライブ当日」を丸ごと覆うから**（11/1 に落ちた
    # 記録が 11/4 まで残る）。⚠⚠ **毎日出る枠は翌日の成功で消える**ので、この窓が
    # 効くのは**動かない枠だけ。**
    #
    # ⚠ **消すと「その枠が次に成功するまで永久」に戻る**（makoto2#77）。
    failure_stale: 7d
  # ⚠ 投稿時刻の解釈に使う唯一の正本。ライブは 12:00 JST に始まるので、稼働先の
  # ローカルタイムが UTC だと 9 時間ずれる。しかも「起動したのに何も起きない」だけ
  # なので気付きにくい。ホストの TZ に依存させない。
  timezone: Asia/Tokyo
sqlite3:
  db: hadlar.db
# チャットボットのモデレーション（makoto2#510 → `ChatGate`）。⚠ **LLM を呼ぶ前に決める門。**
# 🔴 **悪戯をする前の人を疑わない**（2026-11-07・オーナー）— フォローしてからの待ち時間・サーバーで
# 絞る門は置かない。ペナルティは悪戯の印が付いたあとにだけ掛ける。
chat:
  # 🔴 **返事をするか**（makoto2#18）。⚠ **キー（`/anthropic/api_key`）が無ければ、true でも返さない**（受信は続き、
  # `hadlar status` が警告する）。⚠⚠ **困ったときの止め方はこの 1 行**（false にして再起動）。
  enabled: true
  # 🔴 **悪戯の印が付いたら DM で知らせる相手**（makoto2#510・同じサーバーの acct）。
  owner: pooza
  thread:
    # ⚠ **前のやりとりとして渡す祖先の上限**（新しい側から）。⚠ 費用の歯止め。
    max_statuses: 10
  notices:
    # 🔴 **決まった文の置き場**（→ `NoticeRepository`）。⚠ hadlar のディレクトリからの相対か絶対。⚠ 書き換えたら再起動。
    # ⚠ 無い type は黙る（オーナーへの DM だけは素の文で送る）。
    path: config/chat/notices.yaml
  grace:
    # 🔴 **言わせようとした・舞台裏を訊いたは、1 回目はペナルティにしない**（種類ごとに数える）。
    # この期間の中で 2 回目からが印。⚠ 小さな子が素朴に訊く・言葉遊びをすることもある
    # （舞台裏 2026-10-20・言わせようとした 2026-11-08 オーナー）。⚠ 運営を名乗ったは 1 回目から。
    window: 30d
  catch_up:
    # 🔴 **繋ぎ直したとき（と起動時）に取りこぼしたメンションに追いつく**（makoto2#610・2026-11-10 オーナー判断）。
    # 来てからこの時間を超えたものには返さない（遅れて着いた返事は流れに合わない・makoto2#599 と同じ考え方）。
    max_age: 15m
  limit:
    # ⚠ **相手ごとの上限はペナルティではなく、誰にでも同じに掛かる量の枠。**超えたら決まった文を
    # 1 回だけ返して、あとは黙る。⚠ **数えるのは返事の回数 ＝ 会話の往復**。
    # ⚠ 2026-11-07 に 1 時間 3・1 日 10 で決めたが、ステージングで 3 往復で止まり、少なすぎた →
    # 20 / 50 に広げた（2026-11-08・オーナー）。🔴 **指示書のキャッシュで 1 応答が 約 $0.005 になったので
    # 40 / 100 に広げた**（同日・オーナー「十分実用的」）。悪戯には印とペナルティ、暴走には全体の上限で備える。
    account:
      hour: 40
      day: 100
    # 🔴 **暴走したときの歯止め**（予算の枠ではない）。⚠ **月の予算は Console で本番 $50・開発用 $20**
    # （2026-11-09 にオーナーが確認・makoto2#510）。ステージングの実測で、キャッシュから読めた 1 応答 約 $0.003〜0.007・書き込み
    # 約 $0.054（1 時間に 1 回まで）→ 150 回を毎日使い切っても 約 $0.8〜1.3。⚠ キャッシュなしなら 約 $3.8。
    global:
      day: 150
  # 🔴 **フォロワーの一覧を全部引き直す間隔**（→ `FollowerRoster`）。⚠ 新しいフォローは通知ですぐ足すので、
  # これが効くのは「フォローを外した」の反映だけ（外した直後のこの間だけは返事をしうる）。
  followers:
    refresh: 1h
  follow:
    # 🔴 **フォローされたら返し、外されたら外す**（makoto2#606・2026-11-09 オーナー）。⚠ 外されたことは通知されないので、
    # `/chat/followers/refresh` ごとに一覧を突き合わせる。⚠ 返事を止めた相手・ペナルティ中の相手には返さない。
    enabled: true
    # 🔴 **1 回の突き合わせで外す数の上限。**超えたら 1 人も外さずにエラーにする（一覧が欠けたときの事故を防ぐ）。
    # ⚠ 返すほうは止めない。⚠ 本番の初回の差は、返す 31・外す 3（2026-11-09 に公開の一覧で数えた）。
    unfollow_limit: 20
  # 🔴 **悪戯の印の回数でペナルティを延ばす**（n 回目の印は n 番目。尽きたら最後のもの）。
  penalty:
    - 1d
    - 3d
    - 7d
  # 🔴 **返事を作る LLM**（makoto2#18・→ `ChatModel`）。⚠⚠ **全機能で同じモデル**（docs「LLM プロバイダとモデル」）。
  # ⚠ effort `low` は makoto2#19 の評価で決めた値。⚠ 書き換えたら評価を回し直す（`tools/persona_eval/run.py`）。
  model:
    name: claude-opus-5-5
    effort: low
    # ⚠ 思考を含む上限（評価の道具と同じ）。⚠ 返事は 100 字前後なので、届くのは思考が膨らんだときだけ。
    max_tokens: 8000
    # ⚠ **1 回あたりの待ちの上限。**⚠ 時間切れも再試行されるので、最長は timeout × (max_retries + 1)。
    timeout: 60s
    max_retries: 1
    # 🔴 **指示書（人柄と返事の形・約 5,700 トークン）をキャッシュする長さ**（`5m` か `1h` だけ・API の仕様）。
    # ⚠ 毎回同じなので、読めれば入力の大半が 1/20 の単価になる。⚠ 書き込みは 5m で 1.25 倍・1h で 2 倍。
    # ⚠ **読むたびに期限が延びる**（どちらも）。🔴 **1h にした**（2026-11-08・オーナー）— メンションは
    # 数分〜数十分おきにぽつぽつ来るので、5 分以上あいた会話が 1 時間に 2 つあれば 1h が得。⚠ 損をするのは
    # 1 時間に会話がちょうど 1 つのときだけ（1 回 約 $0.017）。ログの cache_write が多すぎれば見直す。
    cache_ttl: 1h
    # 単価（USD / 100 万トークン）。⚠ ログの見積もり（`cost`）にだけ使う。請求額の正本は Console。
    price:
      input: 4.0
      output: 20.0
      cache_read: 0.2
      # ⚠ キャッシュの書き込みは長さで単価が違う（`cache_ttl` に合わせて引く）。
      cache_write:
        5m: 5.0
        1h: 8.0
# メンションの受信（makoto2#29）。⚠ **Mastodon の Streaming API を SSE で読む**（WebSocket ではない・
# 2026-11-07 オーナー判断 → `MentionListener`）。⚠ **いまは受けてログに出すだけ**（応答は makoto2#18）。
streaming:
  # ⚠ **切ると status の `stream` 行が `off` になり、止まりの警告も出ない。**
  enabled: true
  # 🔴 **受信が止まったとみなすまでの猶予。**⚠⚠ **Mastodon は無通信でも 15 秒ごとに合図を流す**ので、
  # 繋がっていれば痕跡は 30 秒ごとに進む（`MentionListener::RECORD_INTERVAL`）。⚠ **繋ぎ直しの
  # 上限（`retry/max`）より長くする** — 短いと、繋ぎ直しを待っている間ずっと鳴る。
  stale: 10m
  # 切れたら繋ぎ直すまでの間隔。⚠ `base * 2 ** (n - 1)` を `max` で頭打ち。
  retry:
    base: 5s
    max: 5m
