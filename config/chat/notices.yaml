# チャットボットの決まった文（→ `NoticeRepository` / `ChatGate::NOTICES`）。LLM を呼ばずに返す。
#
# ⚠ ボットのために書いた文で、原作の台詞ではない（原作の台詞はこの公開リポジトリに置かない）。
# ⚠ 下書き（2026-11-13）。口調はオーナーのレビューで直す。
# ⚠ 複数あれば 1 つを選ぶ。⚠ 書き換えたら常駐の再起動が要る。

# フォロワーでない相手に、話せる条件を伝える（同じ相手へは 1 日 1 回まで）。
chat_ask_follow:
  - 魔軍司令であるこのハドラーと口をききたいなら、まずはフォローしてからにせよ。

# 相手ごとの上限に届いたことを伝える（1 回だけ）。
chat_limit_notice:
  - ええい、今日はもう十分相手をしてやった！ 少し時間を置いてから出直してこい。

# ブロックリストに載ったことを伝える（1 回だけ）。
chat_block_notice:
  - 貴様の相手はもうせん。

# ペナルティの期間に入ったことを伝える（1 回だけ）。
chat_penalty_notice:
  - 調子に乗りおって……しばらく貴様の相手はせんぞ。

# 悪戯の印が付いたことをオーナーへ DM で知らせる（`{acct}` `{reason}` `{marks}` `{until}` `{url}`）。
# ⚠ オーナーにだけ届く。⚠ `{acct}` に `@` を付けない（付けると相手にも届く → `ChatOwnerNotice`）。
chat_owner_notice:
  - '{acct} に印が付きました（{reason}・{marks} 回目・{until} まで応答しません）{url}'
